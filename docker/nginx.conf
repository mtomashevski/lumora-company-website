server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    include /etc/nginx/security-headers.conf;

    # These precede the HTML regex so a name such as .env.html is denied too.
    location ~ /\. {
        deny all;
    }
    location ~* (?:\.(?:env|pem|key|p12|pfx|keystore|bak|backup|old|tmp|log|sql|map|tsx?|jsx|ya?ml|lock)|~)$ {
        deny all;
    }
    location ~* ^/(?:src|node_modules|scripts|docker)(?:/|$) {
        deny all;
    }
    location ~* ^/(?:Dockerfile|package(?:-lock)?\.json|pnpm-lock\.yaml|tsconfig[^/]*\.json)$ {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The build generates HTML for every public route, including all five tours.
    # A full refresh serves that route's HTML; unknown paths retain HTTP 404.
    error_page 404 /404.html;
    location / {
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    # Vite's content-hashed assets can be cached independently of HTML/images.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Do not cache route HTML indefinitely across a new assessment deployment.
    location ~ \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

}
